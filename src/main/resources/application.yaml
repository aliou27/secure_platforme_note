spring:
  application:
    name: secure-notes

  config:
    import: optional:file:.env[.properties]

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/secure_notes_db}
    username: ${DB_USERNAME:notes_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: secure-notes
    expiration: 15m

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
