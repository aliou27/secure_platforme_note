spring:
  application:
    name: secure-notes

  config:
    import: optional:file:.env[.properties]

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/secure_notes_db
    username: notes_app
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC